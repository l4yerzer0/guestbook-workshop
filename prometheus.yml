global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "guestbook-service"
    scrape_interval: 2s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8000"]
